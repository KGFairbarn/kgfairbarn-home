<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KG Fairbarn - Homelab</title>
    <!-- Load Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            background: #1a1a1a; 
            color: #ffffff; 
            text-align: center; 
            padding: 50px 20px; 
        }
        .grid { 
            display: flex; 
            gap: 20px; 
            justify-content: center; 
            flex-wrap: wrap; 
            max-width: 800px;
            margin: 40px auto; 
        }
        .card { 
            background: #333333; 
            padding: 25px; 
            border-radius: 12px; 
            text-decoration: none; 
            color: white; 
            width: 200px; 
            transition: transform 0.2s, background 0.2s; 
            border: 1px solid #444;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .card:hover { 
            background: #404040; 
            transform: translateY(-5px); 
        }
        .icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
            color: #4dabf7;
        }
        h3 { margin: 0 0 8px 0; color: #4dabf7; }
        p { margin: 0; font-size: 0.9em; color: #cccccc; }
    </style>
</head>
<body>
    <h1>KG's Homelab</h1>
    <p>Internal network services and dashboards.</p>
    
    <div class="grid">
        <!-- BirdNET-Pi Card -->
        <a href="https://birdnet.kgfairbarn.com" class="card">
            <i class="bi bi-soundwave icon"></i>
            <h3>BirdNET-Pi</h3>
            <p>Avian Audio Monitoring</p>
        </a>

        <!-- Tempest Weather Station Card -->
        <a href="https://tempestwx.com/station/101823" class="card" target="_blank">
            <i class="bi bi-cloud-sun icon"></i>
            <h3>Tempest Weather</h3>
            <p>Live Weather Station</p>
        </a>
    </div>
</body>
</html>
